map $http_x_forwarded_proto $porthole_scheme {
    default $scheme;
    https https;
}

map $http_x_real_ip $porthole_client_ip {
    "" $remote_addr;
    default $http_x_real_ip;
}

map $http_upgrade $porthole_connection {
    "" "";
    default upgrade;
}

server {
    listen 127.0.0.1:${PORTHOLE_WEB_PORT} default_server;
    server_name _;
    return 404;
}

server {
    listen 127.0.0.1:${PORTHOLE_WEB_PORT};
    server_name ${PORTHOLE_MANAGEMENT_HOST};
    root /usr/share/nginx/html;

    location = /api {
        include /etc/nginx/conf.d/porthole-proxy.inc;
    }

    location ^~ /api/ {
        include /etc/nginx/conf.d/porthole-proxy.inc;
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}

server {
    listen 127.0.0.1:${PORTHOLE_WEB_PORT};
    server_name *.${PORTHOLE_SHARE_DOMAIN};

    location / {
        include /etc/nginx/conf.d/porthole-proxy.inc;
    }
}
