proxy_pass http://127.0.0.1:${PORTHOLE_API_PORT};
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Proto $porthole_scheme;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Real-IP $porthole_client_ip;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $porthole_connection;
proxy_redirect off;

# 访客接收上游流式响应，应用层控制转发与响应时限。
proxy_buffering off;
proxy_request_buffering off;
proxy_read_timeout 120s;
client_max_body_size 100m;
